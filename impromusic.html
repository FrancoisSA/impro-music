    closeEmojiPicker();
    emojiPickerTarget = { pad, el: emojiEl };

    const picker = document.createElement('div');
    picker.id = 'emojiPicker';
    picker.style.cssText = `
      position: fixed; z-index: 900;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; display: flex; flex-wrap: wrap;
      gap: 4px; max-width: 260px; box-shadow: 0 8px 24px var(--shadow);
    `;
    EMOJI_PICKER_LIST.forEach(e => {
      const btn = document.createElement('button');
      btn.textContent = e;
      btn.style.cssText = 'background:none;border:1px solid transparent;border-radius:6px;font-size:24px;padding:4px;cursor:pointer;line-height:1;';
      btn.addEventListener('mouseenter', () => btn.style.borderColor = 'var(--accent)');
      btn.addEventListener('mouseleave', () => btn.style.borderColor = 'transparent');
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        pad.emoji = e;
        closeEmojiPicker();
        renderPads();
      });
      picker.appendChild(btn);
    });

    // Position sous l'élément emoji
    const rect = emojiEl.getBoundingClientRect();
    picker.style.top  = (rect.bottom + 6) + 'px';
    picker.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';

    document.body.appendChild(picker);
    setTimeout(() => document.addEventListener('click', closeEmojiPicker, { once: true }), 0);
  }

  function closeEmojiPicker() {
    document.getElementById('emojiPicker')?.remove();
    emojiPickerTarget = null;
  }

  function cleanFileName(name) {
    return name
      .replace(/\.(mp3|wav|ogg|m4a|aac|flac)$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+(copie|\d+)$/i, '')   // retire " copie", " 2", " 3"…
      .replace(/\(remastered\)/i, '')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/^\w/, c => c.toUpperCase());
  }

  function formatBytes(b) {
    return b > 1048576 ? (b/1048576).toFixed(1)+' Mo' : Math.round(b/1024)+' Ko';
  }

  // Handles du dossier en cours (session) : Map<filename, FileSystemFileHandle>
  let _currentFileHandles = new Map();

  async function openFolderImport() {
    importFiles = [];
    _currentFileHandles = new Map();

    if (window.showDirectoryPicker) {
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file' && /\.(mp3|wav|ogg|m4a|aac)$/i.test(entry.name)) {
            _currentFileHandles.set(entry.name, entry); // garde le FileSystemFileHandle
            importFiles.push(await entry.getFile());
          }
        }
      } catch(e) {
        if (e.name !== 'AbortError') document.getElementById('folderFileInput').click();
        return;
      }
    } else {
      document.getElementById('folderFileInput').click();
      return;
    }

    if (!importFiles.length) { showToast('Aucun fichier audio trouvé'); return; }
    _showImportDialog(importFiles);
  }

  // Fallback : input webkitdirectory (Android sans showDirectoryPicker)
  document.getElementById('folderFileInput').addEventListener('change', function() {
    _currentFileHandles = new Map();
    const files = Array.from(this.files).filter(f => /\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name));
    this.value = '';
    if (!files.length) { showToast('Aucun fichier audio'); return; }
    _showImportDialog(files);
  });

  function _showImportDialog(files) {
    // Trier alphabétiquement
    importFiles = files.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const list = document.getElementById('importFileList');
    list.innerHTML = '';
    importFiles.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'import-file-item';
      div.innerHTML = `
        <div class="ifc"><input type="checkbox" id="ifc${i}" checked></div>
        <label class="if-name" for="ifc${i}">${cleanFileName(f.name)}</label>
        <span class="if-size">${formatBytes(f.size)}</span>
      `;
      list.appendChild(div);
    });
    document.getElementById('importProgressFill').style.width = '0%';
    document.getElementById('importProgressText').textContent = '';
    document.getElementById('btnImportConfirm').disabled = false;
    document.getElementById('btnImportConfirm').textContent = 'Importer';
    document.getElementById('importOverlay').classList.add('open');
  }

  function toggleSelectAll() {
    const boxes  = document.querySelectorAll('#importFileList input[type=checkbox]');
    const allOn  = Array.from(boxes).every(b => b.checked);
    boxes.forEach(b => b.checked = !allOn);
    document.getElementById('importSelectAll').textContent = allOn ? 'Tout sélectionner' : 'Tout désélectionner';
  }

  function selectDest(dest) {
    importDest = dest;
    document.getElementById('destSeq').classList.toggle('selected', dest === 'seq');
    document.getElementById('destPad').classList.toggle('selected', dest === 'pad');
  }

  function closeImport() {
    document.getElementById('importOverlay').classList.remove('open');
    importFiles = [];
  }

  async function confirmImport() {
    const boxes    = document.querySelectorAll('#importFileList input[type=checkbox]');
    const selected = importFiles.filter((_, i) => boxes[i]?.checked);
    if (!selected.length) { showToast('Aucun fichier sélectionné'); return; }

    const btn  = document.getElementById('btnImportConfirm');
    const fill = document.getElementById('importProgressFill');
    const txt  = document.getElementById('importProgressText');
    btn.disabled = true;

    engine.ensureCtx();
    let done = 0;

    for (const file of selected) {
      const name = cleanFileName(file.name);
      txt.textContent = `Chargement : ${name}…`;
      const id = 'folder_' + Date.now() + '_' + done;
      try {
        await engine.loadFile(id, file);
        // Persiste le handle individuel si disponible (import dossier avec showDirectoryPicker)
        const fileHandle = _currentFileHandles.get(file.name);
        if (fileHandle) await audioHandleStore.save(id, fileHandle);
        if (importDest === 'seq') {
          const isFirst = !cues.some(c => c.state === 'next');
          cues.push({
            id, name, type: 'music', vol: 0.80,
            fadeIn: 1, fadeOut: 2, startAt: 0, notes: '',
            state: isFirst ? 'next' : 'pending',
            filepath: file.name, // nom du fichier audio (clé de liaison avec le handle IDB)
          });
        } else {
          pads.push({ id, name, type: 'music', vol: 0.80, emoji: guessEmoji(file.name), filepath: file.name });
        }
      } catch(e) {
        showToast('⚠ Erreur : ' + name);
      }
      done++;
      fill.style.width = (done / selected.length * 100).toFixed(0) + '%';
      renderCueList();
      renderPads();
    }

    txt.textContent = `✓ ${done} fichier${done > 1 ? 's' : ''} importé${done > 1 ? 's' : ''}`;
    btn.textContent = 'Terminé';
    showToast(`✓ ${done} sons ajoutés en ${importDest === 'seq' ? 'séquence' : 'sons libres'}`);
    autoSave();
    setTimeout(closeImport, 1200);
  }

  // ════════════════════════════════════════════════
  // CHARGEMENT DES SONS — handles par fichier
  // Chaque cue/pad stocke son FileSystemFileHandle
  // dans IndexedDB. Au démarrage, on redemande la
  // permission fichier par fichier et on charge.
  // Aucune copie des données audio.
  // ════════════════════════════════════════════════

  function _buildAudioItems() {
    const items = [
      ...cues.filter(c => c.type !== 'section' && c.filepath).map(c => ({ id: c.id, filepath: c.filepath, name: c.name })),
      ...pads.filter(p => p.filepath).map(p => ({ id: p.id, filepath: p.filepath, name: p.name })),
    ];
    // Déduplication par id (chaque cue/pad a son propre handle)
    const seen = new Set();
    return items.filter(x => seen.has(x.id) ? false : (seen.add(x.id), true));
  }

  async function preloadAllSounds() {
    const banner = document.getElementById('loadBanner');
    const text   = document.getElementById('loadBannerText');
    const items  = _buildAudioItems();

    if (!items.length) { banner.classList.add('hidden'); return; }
    banner.classList.remove('hidden');
    text.textContent = 'Chargement des sons…';

    let loaded = 0, missing = [];

    await Promise.allSettled(items.map(async item => {
      const handle = await audioHandleStore.get(item.id);
      if (!handle) { missing.push(item); return; }
      try {
        const perm = await handle.requestPermission({ mode: 'read' });
        if (perm !== 'granted') { missing.push(item); return; }
        const file = await handle.getFile();
        await engine.loadFile(item.id, file);
        loaded++;
      } catch(_) { missing.push(item); }
      text.textContent = `Sons… ${loaded}/${items.length}`;
      renderCueList(); renderPads();
    }));

    renderCueList(); renderPads();

    if (!missing.length) {
      text.textContent = `✓ ${loaded} sons chargés`;
      setTimeout(() => banner.classList.add('hidden'), 2000);
      return;
    }

    // Sons sans handle → proposer de sélectionner le dossier
    window._missingSounds = missing;
    const names   = missing.map(m => m.name);
    const preview = names.slice(0, 3).join(', ') + (names.length > 3 ? ` +${names.length - 3}` : '');
    banner.innerHTML = `
      <div class="load-dot" style="background:var(--red)"></div>
      <span title="${names.join('\n')}">${names.length} son${names.length > 1 ? 's' : ''} manquant${names.length > 1 ? 's' : ''} : <em>${preview}</em></span>
      <button onclick="loadMissingSounds()" style="
        background:var(--accent);color:var(--on-accent);border:none;border-radius:4px;
        padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;">
        📂 Sélectionner le dossier
      </button>
      <button onclick="document.getElementById('loadBanner').classList.add('hidden')" style="
        background:none;border:none;color:var(--text-muted);font-size:16px;
        cursor:pointer;margin-left:auto;padding:0 4px;">✕</button>
    `;
  }

  // Sélectionne un dossier, charge les sons manquants et persiste les handles
  async function loadMissingSounds() {
    const missing = window._missingSounds ?? [];
    if (!missing.length) return;

    let fileHandles = new Map(); // filepath → FileSystemFileHandle

    if (window.showDirectoryPicker) {
      try {
        const dir = await window.showDirectoryPicker({ mode: 'read' });
        for await (const entry of dir.values()) {
          if (entry.kind === 'file' && /\.(mp3|wav|ogg|m4a|aac)$/i.test(entry.name))
            fileHandles.set(entry.name, entry);
        }
      } catch(e) { if (e.name !== 'AbortError') document.getElementById('folderFileInput').click(); return; }
    } else {
      document.getElementById('folderFileInput').click(); return;
    }

    const banner = document.getElementById('loadBanner');
    let loaded = 0, stillMissing = [];

    for (const item of missing) {
      const handle = fileHandles.get(item.filepath);
      if (!handle) { stillMissing.push(item); continue; }
      try {
        const file = await handle.getFile();
        await engine.loadFile(item.id, file);
        await audioHandleStore.save(item.id, handle); // persiste pour les prochaines sessions
        loaded++;
      } catch(_) { stillMissing.push(item); }
    }

    window._missingSounds = stillMissing;
    banner.innerHTML = stillMissing.length === 0
      ? `<div class="load-dot"></div><span>✓ Tous les sons chargés</span>`
      : `<div class="load-dot" style="background:var(--red)"></div><span>${stillMissing.length} son(s) toujours manquant(s)</span>`;

    if (!stillMissing.length) setTimeout(() => banner.classList.add('hidden'), 2000);
    renderCueList(); renderPads();
    showToast(`✓ ${loaded} son${loaded > 1 ? 's' : ''} chargé${loaded > 1 ? 's' : ''}`);
  }

  // ════════════════════════════════════════════════
  // GESTION DES SPECTACLES — fichiers JSON
  // ════════════════════════════════════════════════

  // Construit le payload JSON du projet en cours
  function _buildProjectPayload() {
    return {
      version: '1.0',
      name: currentProjectName ?? 'Sans titre',
      savedAt: new Date().toISOString(),
      cues: cues.map(c => ({ ...c, state: c.state === 'playing' ? 'pending' : c.state })),
      pads: pads.map(p => ({ ...p })),
    };
  }

  // Cache localStorage : restaure le dernier état après rechargement de page
  function _cacheProject() {
    try { localStorage.setItem('impromusic-last-project', JSON.stringify(_buildProjectPayload())); } catch(_) {}
  }
  function _restoreCachedProject() {
    try {
      const raw = localStorage.getItem('impromusic-last-project');
      if (!raw) return false;
      const data = JSON.parse(raw);
      _applyProjectData(data);
      return true;
    } catch(_) { return false; }
  }

  // Injecte les données d'un projet dans les tableaux en cours
  // Migre automatiquement dbKey → filepath pour les anciens projets
  function _applyProjectData(data) {
    cues.length = 0;
    (data.cues ?? []).forEach(c => {
      if (c.dbKey && !c.filepath) { c.filepath = c.dbKey; delete c.dbKey; }
      cues.push(c);
    });
    pads.length = 0;
    (data.pads ?? []).forEach(p => {
      if (p.dbKey && !p.filepath) { p.filepath = p.dbKey; delete p.dbKey; }
      pads.push(p);
    });
    currentProjectName = data.name ?? null;
    document.querySelector('.project-name').textContent = currentProjectName ?? '—';
  }

  // Ouvre un fichier .json via le picker
  async function openProjectFile() {
    try {
      const result = await projectFile.open();
      if (!result) return;
      stopAll();
      engine.clearBuffers();
      _applyProjectData(result.data);
      currentProjectName = result.name;
      document.querySelector('.project-name').textContent = result.name;
      _cacheProject();
      renderCueList();
      renderPads();
      showToast('📂 ' + result.name + ' — vérification des fichiers…');
      await preloadAllSounds();
    } catch(e) {
      showToast('⚠ Erreur ouverture : ' + e.message);
    }
  }

  // Enregistre dans le fichier courant (ou ouvre le picker si nouveau)
  async function saveProjectFile() {
    try {
      const name = await projectFile.save(_buildProjectPayload(), currentProjectName ?? 'spectacle');
      if (!name) return; // annulé
      currentProjectName = name;
      document.querySelector('.project-name').textContent = name;
      _cacheProject();
      showToast('💾 Enregistré : ' + name + '.json');
    } catch(e) {
      showToast('⚠ Erreur enregistrement : ' + e.message);
    }
  }

  // Sauvegarde automatique après chaque modification (fichier + cache)
  async function autoSave() {
    _cacheProject(); // toujours mettre à jour le cache local
    if (!projectFile.hasHandle()) return; // pas de fichier ouvert → pas d'écriture
    try {
      await projectFile.save(_buildProjectPayload(), currentProjectName);
      _flashSaveIndicator();
    } catch(_) { /* échec silencieux, le cache localStorage est déjà à jour */ }
  }

  let _flashTimer = null;
  function _flashSaveIndicator() {
    const el = document.querySelector('.project-name');
    el.textContent = (currentProjectName ?? '—') + ' ✓';
    clearTimeout(_flashTimer);
    _flashTimer = setTimeout(() => { el.textContent = currentProjectName ?? '—'; }, 1500);
  }

  // ════════════════════════════════════════════════
  // PANNEAU THÈME
  // ════════════════════════════════════════════════

  const DEFAULT_THEME = {
    '--bg': '#0f0f0f',
    '--surface': '#1a1a1a',
    '--surface2': '#242424',
    '--border': '#2e2e2e',
    '--accent': '#e8a020',
    '--text': '#fafafa',
    '--text-dim': '#aaaaaa',
    '--text-muted': '#999999',
    '--green': '#2ecc71',
    '--green-dark': '#27ae60',
    '--red': '#e74c3c',
    '--red-dark': '#c0392b',
    '--color-music': '#3498db',
    '--color-fx': '#9b59b6',
    '--color-ambiance': '#1abc9c',
    '--color-loop': '#e67e22',
  };

  // Couleurs qui ont des variantes rgba dépendantes — recalculées à chaque changement
  const RGBA_DEPS = {
    '--accent':        [['--accent-bg',0.08],['--accent-bg2',0.12],['--accent-glow',0.2],['--accent-bg3',0.15]],
    '--green':         [['--green-bg',0.05]],
    '--red':           [['--red-bg',0.15]],
    '--color-loop':    [['--loop-bg',0.2],['--loop-bg2',0.15],['--loop-border',0.3]],
    '--color-music':   [['--music-bg',0.2],['--music-bg2',0.08]],
    '--color-fx':      [['--fx-bg',0.2]],
    '--color-ambiance':[['--ambiance-bg',0.2]],
  };

  function hexToRgb(hex) {
    const c = hex.replace('#','');
    const full = c.length === 3 ? c.split('').map(x=>x+x).join('') : c;
    return [parseInt(full.slice(0,2),16), parseInt(full.slice(2,4),16), parseInt(full.slice(4,6),16)];
  }

  function applyThemeVar(varName, hex) {
    document.documentElement.style.setProperty(varName, hex);
    const deps = RGBA_DEPS[varName];
    if (deps) {
      const [r,g,b] = hexToRgb(hex);
      deps.forEach(([dep, alpha]) => {
        document.documentElement.style.setProperty(dep, `rgba(${r},${g},${b},${alpha})`);
      });
    }
  }

  function applyFullTheme(theme) {
    Object.entries(theme).forEach(([k,v]) => applyThemeVar(k, v));
  }

  function saveTheme(theme) {
    localStorage.setItem('impromusic-theme', JSON.stringify(theme));
  }

  function loadSavedTheme() {
    try {
      const saved = localStorage.getItem('impromusic-theme');
      if (saved) applyFullTheme(JSON.parse(saved));
    } catch(_) {}
  }

  function openThemePanel() {
    _buildThemeRows();
    document.getElementById('themePanel').classList.add('open');
    document.getElementById('themeOverlay').classList.add('open');
  }

  function closeThemePanel() {
    document.getElementById('themePanel').classList.remove('open');
    document.getElementById('themeOverlay').classList.remove('open');
  }

  function resetTheme() {
    applyFullTheme(DEFAULT_THEME);
    localStorage.removeItem('impromusic-theme');
    _buildThemeRows();
    showToast('↺ Thème réinitialisé');
  }

  function _buildThemeRows() {
    document.querySelectorAll('.theme-row[data-var]').forEach(row => {
      const varName = row.dataset.var;
      const label   = row.dataset.label;
      const current = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
      // Convertit la valeur courante en hex pour le color picker
      const hex = _cssColorToHex(current) ?? DEFAULT_THEME[varName] ?? '#ffffff';
      row.innerHTML = `
        <span class="theme-row-label">${label}</span>
        <div class="theme-swatch" style="background:${hex}">
          <input type="color" value="${hex}" data-var="${varName}">
        </div>
        <span class="theme-hex">${hex}</span>`;
      row.querySelector('input').addEventListener('input', e => {
        const v = e.target.value;
        applyThemeVar(varName, v);
        row.querySelector('.theme-swatch').style.background = v;
        row.querySelector('.theme-hex').textContent = v;
        // Sauvegarde toutes les valeurs courantes
        const theme = {};
        document.querySelectorAll('.theme-row[data-var]').forEach(r => {
          const inp = r.querySelector('input[type="color"]');
          if (inp) theme[r.dataset.var] = inp.value;
        });
        saveTheme(theme);
      });
    });
  }

  function _cssColorToHex(color) {
    if (!color) return null;
    color = color.trim();
    if (color.startsWith('#')) {
      if (color.length === 4) return '#' + color.slice(1).split('').map(c=>c+c).join('');
      return color.slice(0,7);
    }
    // Pour les noms courts comme #aaa → déjà géré au-dessus
    return null;
  }

  // Charge le thème sauvegardé au démarrage
  loadSavedTheme();

  // ════════════════════════════════════════════════
  // MIGRATION — anciens spectacles IndexedDB → JSON
  // Lit l'ancienne base 'impromusic-projects' et
  // propose de télécharger chaque spectacle en .json.
  // S'affiche automatiquement au démarrage si des
  // anciens spectacles sont détectés.
  // ════════════════════════════════════════════════
  async function _migrateOldProjects() {
    const DB = 'impromusic-projects', ST = 'projects';
    const projects = await new Promise(res => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => res([]); // base vide ou nouvelle → rien à migrer
      req.onsuccess = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(ST)) { db.close(); res([]); return; }
        const r = db.transaction(ST, 'readonly').objectStore(ST).getAll();
        r.onsuccess = ev => { db.close(); res(ev.target.result); };
        r.onerror   = ()  => { db.close(); res([]); };
      };
      req.onerror = () => res([]);
    });

    if (!projects.length) return;

    // Affiche le bandeau de migration
    const banner = document.getElementById('loadBanner');
    banner.classList.remove('hidden');
    banner.innerHTML = `
      <div class="load-dot" style="background:var(--color-music)"></div>
      <span><strong>${projects.length} ancien${projects.length > 1 ? 's' : ''} spectacle${projects.length > 1 ? 's' : ''}</strong> trouvé${projects.length > 1 ? 's' : ''} — télécharge-les en JSON pour les utiliser avec la nouvelle version</span>
      <button id="btnMigrate" style="
        background:var(--accent);color:var(--on-accent);border:none;border-radius:4px;
        padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;white-space:nowrap;">
        ⬇ Exporter en JSON
      </button>
      <button onclick="document.getElementById('loadBanner').classList.add('hidden')" style="
        background:none;border:none;color:var(--text-muted);font-size:16px;
        cursor:pointer;margin-left:auto;padding:0 4px;">✕</button>
    `;

    document.getElementById('btnMigrate').addEventListener('click', () => {
      projects.forEach(p => {
        const payload = {
          version: '1.0',
          name: p.name,
          savedAt: p.savedAt,
          cues: (p.cues ?? []).map(c => ({ ...c, state: c.state === 'playing' ? 'pending' : c.state })),
          pads: p.pads ?? [],
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = (p.name ?? 'spectacle').replace(/[^a-zA-Z0-9_\-\s]/g, '') + '.json';
        a.click();
        URL.revokeObjectURL(url);
      });
      showToast(`✓ ${projects.length} fichier${projects.length > 1 ? 's' : ''} téléchargé${projects.length > 1 ? 's' : ''}`);
      banner.classList.add('hidden');
    });
  }

  // ── INIT ──
  // Restaure le dernier projet depuis le cache localStorage (survit au rechargement de page).
  // Les fichiers audio sont rechargés depuis IndexedDB (cache audio persistant).
  (async () => {
    _restoreCachedProject();
    renderCueList();
    renderPads();
    await preloadAllSounds();
    await _migrateOldProjects(); // détecte et propose la migration si nécessaire
  })();
</script>
</body>
</html>
